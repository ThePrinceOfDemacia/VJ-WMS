services:
  postgres:
    image: postgres:16-alpine
    container_name: vjwms-postgres
    environment:
      POSTGRES_USER: vjwms
      POSTGRES_PASSWORD: vjwms_dev_2026
      POSTGRES_DB: vjwms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vjwms -d vjwms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vjwms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vjwms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vjwms_minio
      MINIO_ROOT_PASSWORD: vjwms_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
